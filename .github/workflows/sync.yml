name: VitaDock → Garmin sync

# Schedule and manual start only. NO pull_request/push triggers:
# this way code from a fork or PR can never run with the secrets.
on:
  schedule:
    - cron: "7 10 * * *"        # daily at 10:07 Amsterdam time (summer and winter time)
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      since:
        description: "Optional: sync everything from this date (YYYY-MM-DD)"
        required: false
        default: ""
      dry_run:
        description: "Only show, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                 # only for the keepalive (keep the workflow enabled)

concurrency:
  group: vitadock-garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secrets live in this environment; it is restricted to the main branch.
    environment: garmin-sync
    env:
      HAS_TOKEN_PAT: ${{ secrets.TOKEN_UPDATE_PAT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install dependencies (hash-verified)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --only-binary=:all: -r requirements.lock

      - name: Prepare Garmin tokens
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/garmin"
          printf '%s' "$GARMIN_TOKENS" > "$RUNNER_TEMP/garmin/garmin_tokens.json"
          cp "$RUNNER_TEMP/garmin/garmin_tokens.json" "$RUNNER_TEMP/garmin/original.json"

      - name: Sync
        env:
          VITADOCK_EMAIL: ${{ secrets.VITADOCK_EMAIL }}
          VITADOCK_PASSWORD: ${{ secrets.VITADOCK_PASSWORD }}
          GARMINTOKENS: ${{ runner.temp }}/garmin
          # Pass inputs via env, never interpolate them into the script (script injection)
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--private)
          if [ -n "${INPUT_SINCE:-}" ]; then args+=(--since "$INPUT_SINCE"); fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          .venv/bin/python vitadock_garmin_sync.py "${args[@]}"

      - name: Write refreshed Garmin tokens back to secret
        if: always() && env.HAS_TOKEN_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOKEN_UPDATE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          f="$RUNNER_TEMP/garmin/garmin_tokens.json"
          if [ -s "$f" ] && ! cmp -s "$f" "$RUNNER_TEMP/garmin/original.json"; then
            gh secret set GARMIN_TOKENS --repo "$REPO" --env garmin-sync < "$f"
            echo "Garmin tokens refreshed and saved."
          else
            echo "Tokens unchanged."
          fi

      - name: Clean up token files
        if: always()
        run: rm -rf "$RUNNER_TEMP/garmin"

      # GitHub disables scheduled workflows in public repos after 60 days without
      # repository activity. This re-enables the workflow (without a commit) on every run.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/sync.yml/enable" --silent
