name: VitaDock → Garmin sync

# Alleen planning en handmatige start. GEEN pull_request/push-triggers:
# zo kan code uit een fork of PR nooit met de secrets draaien.
on:
  schedule:
    - cron: "17 6 * * *"        # dagelijks 06:17 UTC (08:17 zomertijd / 07:17 wintertijd)
  workflow_dispatch:
    inputs:
      since:
        description: "Optioneel: sync alles vanaf datum (YYYY-MM-DD)"
        required: false
        default: ""
      dry_run:
        description: "Alleen tonen, niets uploaden"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                 # alleen voor de keepalive (workflow actief houden)

concurrency:
  group: vitadock-garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secrets staan in deze environment; die is beperkt tot de main-branch.
    environment: garmin-sync
    env:
      HAS_TOKEN_PAT: ${{ secrets.TOKEN_UPDATE_PAT != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Dependencies installeren (hash-gecontroleerd)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --only-binary=:all: -r requirements.lock

      - name: Garmin-tokens klaarzetten
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/garmin"
          printf '%s' "$GARMIN_TOKENS" > "$RUNNER_TEMP/garmin/garmin_tokens.json"
          cp "$RUNNER_TEMP/garmin/garmin_tokens.json" "$RUNNER_TEMP/garmin/original.json"

      - name: Synchroniseren
        env:
          VITADOCK_EMAIL: ${{ secrets.VITADOCK_EMAIL }}
          VITADOCK_PASSWORD: ${{ secrets.VITADOCK_PASSWORD }}
          GARMINTOKENS: ${{ runner.temp }}/garmin
          # Inputs via env, nooit direct in het script interpoleren (script-injectie)
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--private)
          if [ -n "${INPUT_SINCE:-}" ]; then args+=(--since "$INPUT_SINCE"); fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          .venv/bin/python vitadock_garmin_sync.py "${args[@]}"

      - name: Ververste Garmin-tokens terugschrijven naar secret
        if: always() && env.HAS_TOKEN_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOKEN_UPDATE_PAT }}
          REPO: ${{ github.repository }}
        run: |
          f="$RUNNER_TEMP/garmin/garmin_tokens.json"
          if [ -s "$f" ] && ! cmp -s "$f" "$RUNNER_TEMP/garmin/original.json"; then
            gh secret set GARMIN_TOKENS --repo "$REPO" --env garmin-sync < "$f"
            echo "Garmin-tokens ververst en opgeslagen."
          else
            echo "Tokens ongewijzigd."
          fi

      - name: Tokenbestanden opruimen
        if: always()
        run: rm -rf "$RUNNER_TEMP/garmin"

      # GitHub zet geplande workflows in publieke repo's uit na 60 dagen zonder
      # repo-activiteit. Dit zet de workflow (zonder commit) steeds weer aan.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X PUT "repos/$REPO/actions/workflows/sync.yml/enable" --silent
